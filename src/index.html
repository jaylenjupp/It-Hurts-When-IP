<!DOCTYPE html>
<html lang="en">
  <head>
    <meta name="color-scheme" content="dark" />
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>It Hurts When IP</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="container">

      <div class="section">
        <label for="interface-select">Network Interface</label>
        <div class="interface-row">
          <select id="interface-select">
            <option>Loading interfaces...</option>
          </select>
        </div>
      </div>

      <div class="section current-ip-display">
        <div id="current-ip-label">IP: —</div>
        <div id="current-subnet-label">Subnet: —</div>
        <div id="current-gateway-label">Gateway: —</div>
        <div id="current-dhcp-label"></div>
        <div id="link-local-warning"></div>
      </div>

      <div class="button-grid">
        <div class="quick-set-wrapper">
          <button id="quick-set-1">
            <span class="btn-content">
              <span class="btn-title">Quick Set 1</span>
              <span class="btn-subtitle" id="qs1-subtitle">Not configured</span>
            </span>
            <span class="meatball-zone" id="meatball-qs1">⋯</span>
          </button>
          <div class="meatball-menu" id="menu-qs1">
            <button class="menu-item" id="edit-qs1">Edit</button>
            <button class="menu-item danger" id="reset-qs1">Reset</button>
          </div>
        </div>
        <div class="quick-set-wrapper">
          <button id="quick-set-2">
            <span class="btn-content">
              <span class="btn-title">Quick Set 2</span>
              <span class="btn-subtitle" id="qs2-subtitle">Not configured</span>
            </span>
            <span class="meatball-zone" id="meatball-qs2">⋯</span>
          </button>
          <div class="meatball-menu" id="menu-qs2">
            <button class="menu-item" id="edit-qs2">Edit</button>
            <button class="menu-item danger" id="reset-qs2">Reset</button>
          </div>
        </div>
        <div class="quick-set-wrapper">
          <button id="quick-set-3">
            <span class="btn-content">
              <span class="btn-title">Quick Set 3</span>
              <span class="btn-subtitle" id="qs3-subtitle">Not configured</span>
            </span>
            <span class="meatball-zone" id="meatball-qs3">⋯</span>
          </button>
          <div class="meatball-menu" id="menu-qs3">
            <button class="menu-item" id="edit-qs3">Edit</button>
            <button class="menu-item danger" id="reset-qs3">Reset</button>
          </div>
        </div>
        <div class="quick-set-wrapper">
          <button id="quick-set-4">
            <span class="btn-content">
              <span class="btn-title">Quick Set 4</span>
              <span class="btn-subtitle" id="qs4-subtitle">Not configured</span>
            </span>
            <span class="meatball-zone" id="meatball-qs4">⋯</span>
          </button>
          <div class="meatball-menu" id="menu-qs4">
            <button class="menu-item" id="edit-qs4">Edit</button>
            <button class="menu-item danger" id="reset-qs4">Reset</button>
          </div>
        </div>
      </div>
      
      <div class="bottom-buttons">
        <button id="prev-ip">
          <span class="btn-title">Previous IP</span>
          <span class="btn-subtitle" id="prev-ip-subtitle">—</span>
        </button>
        <button id="set-dhcp">Set DHCP</button>
      </div>
    

      <!-- Editor Panel -->
      <div class="editor-panel" id="editor-panel">
        <div class="editor-header">
          <span id="editor-title">Edit Quick Set</span>
          <button class="close-btn" id="close-editor">✕</button>
        </div>
        <div class="editor-fields">
          <div class="field">
            <label>Name</label>
            <input type="text" id="edit-name" placeholder="Quick Set ..." />
          </div>
          <div class="field">
            <label>IP Address</label>
            <input type="text" id="edit-ip" placeholder="e.g. 192.168.1.50" />
          </div>
          <div class="field">
            <label>Subnet Mask</label>
            <input type="text" id="edit-subnet" placeholder="e.g. 255.255.255.0" />
          </div>
          <div class="field">
            <label>Gateway</label>
            <input type="text" id="edit-gateway" placeholder="No gateway? Use 0.0.0.0" />
          </div>
        </div>
        <button id="save-edit">Save</button>
      </div>

      <div class="collapsible-section" id="manual-section">
        <button class="collapsible-header" id="manual-toggle">
          <span>Manual IP Entry</span>
          <span class="collapse-arrow" id="collapse-arrow">▾</span>
        </button>
        <div class="collapsible-body" id="manual-body">
          <div class="field">
            <label>IP Address</label>
            <input type="text" id="manual-ip" placeholder="e.g. 192.168.1.50" />
          </div>
          <div class="field">
            <label>Subnet Mask</label>
            <input type="text" id="manual-subnet" placeholder="e.g. 255.255.255.0" />
          </div>
          <div class="field">
            <label>Gateway</label>
            <input type="text" id="manual-gateway" placeholder="No gateway? Use 0.0.0.0" />
          </div>
          <button id="manual-apply">Apply</button>
        </div>
      </div>
    
      <div class="status-bar" id="status-bar">Ready</div>
      
     <div class="signature">
        <span class="signature-title">IT HURTS WHEN IP</span>
        <span class="signature-by">by Jaylen Jupp</span>
        <span class="signature-version">1.11.0</span>
      </div> 

    </div>

    <script src="main.js" type="module"></script>
  </body>
</html>
