[package]
name = "ip-switcher"
version = "1.11.0"
edition = "2021"

[[bin]]
name = "ip-switcher"
path = "src/main.rs"

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[build-dependencies]
tauri-build = { version = "2", features = [] }
