[package]
name = "it-hurts-when-ip"
version = "1.11.0"
edition = "2021"

[[bin]]
name = "it-hurts-when-ip"
path = "src/main.rs"

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[target.'cfg(target_os = "macos")'.dependencies]
# macOS-specific deps go here (currently none — std::os::unix is built in)

[target.'cfg(target_os = "windows")'.dependencies]
# platform/windows.rs uses std::os::windows::process::CommandExt (built into
# std on Windows) and shells out to PowerShell. No extra crates needed here.
# windows-sys and windows-service live in service-tool/Cargo.toml because the
# privileged Win32 IP Helper calls happen in that process, not in the Tauri app.